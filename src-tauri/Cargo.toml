[package]
name = "proxy-launcher"
version = "0.2.2"
description = "High-performance proxy launcher desktop application"
edition = "2021"

[lib]
name = "proxy_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
launcher-core = { path = "../crates/launcher-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
