name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签名称（如 v0.2.2；留空则自动读取 package.json 版本）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}" -ne "") {
            $tag = "${{ inputs.tag }}"
          } else {
            $pkg = Get-Content -Raw -Path "package.json" | ConvertFrom-Json
            $tag = "v$($pkg.version)"
          }
          Write-Host "Resolved release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build frontend
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Run tests
        shell: pwsh
        run: cargo test -p launcher-core -p launcher-cli -p e2e-tests

      - name: Build Release binaries
        shell: pwsh
        run: |
          cargo build --release -p proxy-launcher --features custom-protocol
          cargo build --release -p launcher-cli

      - name: Package portable archive
        id: package
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipName = "proxy-launcher-$tag-windows-x64.zip"
          $stagingDir = Join-Path $PWD "portable-staging"

          if (Test-Path $stagingDir) {
            Remove-Item -Recurse -Force $stagingDir
          }
          New-Item -ItemType Directory -Path $stagingDir | Out-Null

          $proxyExe = "target\release\proxy-launcher.exe"
          $cliExe = "target\release\launcher-cli.exe"
          $webviewDll = "target\release\WebView2Loader.dll"

          if (-not (Test-Path $webviewDll)) {
            $foundDll = Get-ChildItem -Path "target\release\build" -Filter "WebView2Loader.dll" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "x64" } |
              Select-Object -First 1
            if ($foundDll) {
              $webviewDll = $foundDll.FullName
            }
          }

          foreach ($required in @($proxyExe, $cliExe, $webviewDll, "config.example.json", "使用说明.md")) {
            if (-not (Test-Path $required)) {
              throw "Missing required release file: $required"
            }
          }

          Copy-Item -Path $proxyExe -Destination (Join-Path $stagingDir "proxy-launcher.exe")
          Copy-Item -Path $webviewDll -Destination (Join-Path $stagingDir "WebView2Loader.dll")
          Copy-Item -Path $cliExe -Destination (Join-Path $stagingDir "launcher-cli.exe")
          Copy-Item -Path "config.example.json" -Destination (Join-Path $stagingDir "config.json")
          Copy-Item -Path "使用说明.md" -Destination (Join-Path $stagingDir "使用说明.md")

          Write-Host "Staging contents:"
          Get-ChildItem -Path $stagingDir | Format-Table Name, Length

          if (Test-Path $zipName) {
            Remove-Item -Force $zipName
          }
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -CompressionLevel Optimal

          if (-not (Test-Path $zipName)) {
            throw "Failed to create archive: $zipName"
          }
          Write-Host "Created archive: $zipName ($((Get-Item $zipName).Length) bytes)"
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipName = "${{ steps.package.outputs.zip_name }}"

          $ErrorActionPreference = 'Continue'
          gh release view $tag --json url 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'

          if ($releaseExists) {
            Write-Host "Release $tag already exists, uploading asset with --clobber..."
            gh release upload $tag $zipName --clobber
          } else {
            Write-Host "Creating GitHub Release $tag..."
            gh release create $tag $zipName `
              --target "${{ github.sha }}" `
              --title "Proxy Launcher $tag" `
              --generate-notes
          }
